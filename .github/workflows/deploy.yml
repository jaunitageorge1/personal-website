# Build the site and publish it to GitHub Pages.
#
# The accessibility audits run before the upload and the job fails on any
# finding, so a build that breaks the site's WCAG 2.2 AA claim never reaches
# the live URL. They run against the same prefixed build that deploys, not a
# separate root-path one — a broken link under /<repo>/ would otherwise pass
# locally and 404 in production.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow default is read-only; only the deploy job
# needs to write Pages and mint an OIDC token.
permissions:
  contents: read

# Never let two deploys race; let a run in progress finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The audits drive a real browser, and the build renders the résumé
      # PDFs through it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Pages has to be switched on once, by hand: Settings → Pages → Build
      # and deployment → Source: GitHub Actions. The workflow cannot do it —
      # configure-pages offers `enablement: true`, but creating a Pages site
      # needs repository-admin rights, and GITHUB_TOKEN's `pages: write` only
      # covers deploying to a site that already exists. Tried and confirmed:
      # "Create Pages site failed: Resource not accessible by integration".
      #
      # Two things make this step fail with "Get Pages site failed":
      #   - Pages not yet enabled (the one-time setting above);
      #   - a private repository on GitHub Free — Pages serves private repos
      #     only on a paid plan, so the repo must be public or the plan
      #     upgraded.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path is /<repo> for a project site and empty once a custom domain
      # is attached, so the same build works either way with no edit here.
      - name: Build and audit
        run: npm run check
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # The github-pages environment is created with a deployment-branch policy
    # limited to the default branch. A workflow_dispatch from any other branch
    # still builds and audits — a useful dry run — but stops here rather than
    # failing at the environment gate.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The build job proves the build; this proves the deploy. It hits the real
  # URL from the runner: every page the sitemap lists is served, every
  # same-origin link and asset resolves under the real path prefix, the PDFs
  # come back as PDFs, the CSP meta tag survived, and axe and reflow still
  # pass with third-party resources loading for real rather than blocked.
  # A failure here cannot undo the deploy — it makes the run red so the
  # problem is seen rather than found by a visitor.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # EXPECTED_BUILD is the commit just deployed; the script waits until the
      # host serves that build (/build.txt) before checking anything, so it can
      # tell this deploy from the previous one still sitting at the CDN edge.
      - name: Verify the live site
        run: node scripts/verify-live.mjs "${{ needs.deploy.outputs.page_url }}"
        env:
          EXPECTED_BUILD: ${{ github.sha }}
