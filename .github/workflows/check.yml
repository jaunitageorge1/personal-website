# Run the full audit suite on every pull request and on main.
#
# Same checks the deploy runs, at the root path rather than the Pages
# sub-path, so a regression is caught on the PR rather than at deploy time.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Contrast across the palette, axe over every page, the QA audit
      # (keyboard, target size, text spacing, links, HTML validity, CSP) and
      # the contact form's behaviour with and without JavaScript.
      - name: Build and audit
        run: npm run check

      # The committed PDFs are generated from the résumé pages; if an edit to
      # the résumé data lands without re-running the generator, they drift.
      - name: Check the résumé PDFs are up to date
        run: |
          npm run resumes:pdf
          if ! git diff --quiet -- src/assets/resumes; then
            echo "::error::The committed résumé PDFs do not match the résumé pages."
            echo "Run 'npm run build && npm run resumes:pdf' and commit the result."
            git diff --stat -- src/assets/resumes
            exit 1
          fi
